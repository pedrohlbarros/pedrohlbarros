<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pedro Barros — Senior Software Engineer, PHP Systems Architecture">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a2232" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c83f0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c83f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0f17" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0b0f17" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b0f17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#8b93f8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .edge { fill: none; stroke: #2b3650; stroke-width: 1.5; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .node rect { fill: #0f1522; stroke: #2b3650; stroke-width: 1.2; }
      .node text { fill: #c3cde0; font-size: 12.5px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0b0f17"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="700" height="320" fill="url(#fade)"/>

    <!-- topology edges -->
    <path id="e1" class="edge" d="M770 105 H840"/>
    <path id="e2" class="edge" d="M950 105 H1020"/>
    <path id="e3" class="edge" d="M880 123 C880 160 730 160 730 197"/>
    <path id="e4" class="edge" d="M770 215 H840"/>
    <path id="e5" class="edge" d="M950 215 H1020"/>
    <path id="e6" class="edge" d="M910 123 C910 160 1060 160 1060 197"/>

    <!-- messages in flight -->
    <circle r="3" fill="#5eead4"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3" fill="#8b93f8"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="3" fill="#8b93f8"><animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>

    <!-- nodes -->
    <g class="node mono">
      <rect x="660" y="87" width="110" height="36" rx="8"/><circle cx="678" cy="105" r="4" fill="#5eead4"/><text x="690" y="109.5">gateway</text>
      <rect x="840" y="87" width="110" height="36" rx="8" style="stroke:#5b62c9"/><circle cx="858" cy="105" r="4" fill="#8b93f8"/><text x="870" y="109.5">hyperf</text>
      <rect x="1020" y="87" width="110" height="36" rx="8"/><circle cx="1038" cy="105" r="4" fill="#f87171"/><text x="1050" y="109.5">redis</text>
      <rect x="660" y="197" width="110" height="36" rx="8"/><circle cx="678" cy="215" r="4" fill="#fbbf24"/><text x="690" y="219.5">kafka</text>
      <rect x="840" y="197" width="110" height="36" rx="8"/><circle cx="858" cy="215" r="4" fill="#5eead4"/><text x="870" y="219.5">workers</text>
      <rect x="1020" y="197" width="110" height="36" rx="8"/><circle cx="1038" cy="215" r="4" fill="#8b93f8"/><text x="1050" y="219.5">otel</text>
    </g>

    <!-- identity -->
    <text x="56" y="88" class="mono" font-size="14" fill="#5eead4">~/pedrohlbarros</text>
    <text x="56" y="148" class="sans" font-size="54" font-weight="700" fill="#f1f5fb" letter-spacing="-1">Pedro Barros</text>
    <rect x="58" y="166" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="56" y="204" class="sans" font-size="22" fill="#a9b6cc">Senior Software Engineer · PHP Systems Architecture</text>
    <text x="56" y="250" class="mono" font-size="15" fill="#7f8ba3"><tspan fill="#8b93f8">&gt;</tspan> high-performance PHP · distributed systems · observability<tspan class="cursor" fill="#5eead4"> ▍</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1f2940"/>
</svg>
