<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pedro Barros — Senior Software Engineer, PHP Systems Architecture">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1a2232" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#7c83f0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7c83f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0f17" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#0b0f17" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0b0f17" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#8b93f8"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .edge { fill: none; stroke: #3a4868; stroke-width: 1.6; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .tele { fill: none; stroke: #4e4a96; stroke-width: 1.3; stroke-dasharray: 2 5; animation: flow 2.2s linear infinite; }
      .fail { fill: none; stroke: #6a3040; stroke-width: 1.4; stroke-dasharray: 3 5; }
      .node rect { fill: #0f1522; stroke: #2b3650; stroke-width: 1.2; }
      .node text { fill: #c3cde0; font-size: 12.5px; }
      .cap { fill: #5d6984; font-size: 10.5px; letter-spacing: .5px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0b0f17"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect width="680" height="320" fill="url(#fade)"/>

    <!-- telemetry -->
    <path id="t1" class="tele" d="M668 176 C668 90 850 46 910 46"/>
    <path id="t2" class="tele" d="M966 104 V62"/>
    <path id="t3" class="tele" d="M1022 254 C1044 236 1044 72 1022 56"/>
    <path id="t4" class="tele" d="M1022 46 H1056"/>

    <!-- event flow -->
    <path id="d1" class="edge" d="M724 192 H756"/>
    <path id="d2" class="edge" d="M868 186 C890 186 888 120 910 120"/>
    <path id="d3" class="edge" d="M868 198 C890 198 888 264 910 264"/>
    <path id="d4" class="edge" d="M1022 120 H1056"/>
    <path id="d5" class="edge" d="M1022 264 H1056"/>

    <!-- failure / retry loop -->
    <path id="f1" class="fail" d="M950 280 C950 306 830 306 830 280"/>
    <path id="r1" class="edge" d="M868 264 H910" style="stroke:#4a3a20"/>

    <!-- messages -->
    <circle r="3" fill="#5eead4"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#d1"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="1.8s" begin="0.5s" repeatCount="indefinite"><mpath href="#d2"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite"><mpath href="#d3"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#d4"/></animateMotion></circle>
    <circle r="3" fill="#5eead4"><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite"><mpath href="#d5"/></animateMotion></circle>

    <circle r="2.5" fill="#8b93f8"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
    <circle r="2.5" fill="#8b93f8"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
    <circle r="2.5" fill="#8b93f8"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>
    <circle r="2.5" fill="#8b93f8"><animateMotion dur="1.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion></circle>

    <!-- failed message goes to retry queue, then is reprocessed -->
    <circle r="3.2" fill="#f87171">
      <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"><mpath href="#f1"/></animateMotion>
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.35"/>
    </circle>
    <circle r="3.2" fill="#fbbf24">
      <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.5;0.8;1" calcMode="linear"><mpath href="#r1"/></animateMotion>
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.8"/>
    </circle>

    <!-- nodes -->
    <g class="node mono">
      <rect x="910" y="30" width="112" height="32" rx="8"/><circle cx="926" cy="46" r="4" fill="#8b93f8"/><text x="938" y="50.5">otel</text>
      <rect x="1056" y="30" width="112" height="32" rx="8"/><circle cx="1072" cy="46" r="4" fill="#f59e0b"/><text x="1084" y="50.5">grafana</text>

      <rect x="910" y="104" width="112" height="32" rx="8"/><circle cx="926" cy="120" r="4" fill="#5eead4"/><text x="938" y="124.5">consumer-a</text>
      <rect x="1056" y="104" width="112" height="32" rx="8"/><circle cx="1072" cy="120" r="4" fill="#60a5fa"/><text x="1084" y="124.5">mysql</text>

      <rect x="612" y="176" width="112" height="32" rx="8" style="stroke:#5b62c9"/><circle cx="628" cy="192" r="4" fill="#8b93f8"/><text x="640" y="196.5">hyperf</text>
      <rect x="756" y="176" width="112" height="32" rx="8" style="stroke:#6b5420"/><circle cx="772" cy="192" r="4" fill="#fbbf24"/><text x="784" y="196.5">kafka</text>

      <rect x="910" y="248" width="112" height="32" rx="8">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite" values="#f87171;#2b3650;#2b3650;#5eead4;#2b3650" keyTimes="0;0.2;0.8;0.85;1"/>
      </rect><circle cx="926" cy="264" r="4" fill="#5eead4"/><text x="938" y="268.5">consumer-b</text>
      <rect x="1056" y="248" width="112" height="32" rx="8"/><circle cx="1072" cy="264" r="4" fill="#f87171"/><text x="1084" y="268.5">redis</text>
      <rect x="756" y="248" width="112" height="32" rx="8"/><circle cx="772" cy="264" r="4" fill="#fb923c"/><text x="784" y="268.5">rabbitmq</text>
    </g>
    <g class="mono cap">
      <text x="668" y="224" text-anchor="middle">producer</text>
      <text x="812" y="224" text-anchor="middle">topic</text>
      <text x="748" y="268" text-anchor="end">retry · dlq</text>
      <text x="1112" y="20" text-anchor="middle">dashboards</text>
    </g>

    <!-- identity -->
    <text x="56" y="88" class="mono" font-size="14" fill="#5eead4">~/pedrohlbarros</text>
    <text x="56" y="148" class="sans" font-size="54" font-weight="700" fill="#f1f5fb" letter-spacing="-1">Pedro Barros</text>
    <rect x="58" y="166" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="56" y="204" class="sans" font-size="20" fill="#a9b6cc">Senior Software Engineer · PHP Systems Architecture</text>
    <text x="56" y="248" class="mono" font-size="14" fill="#7f8ba3"><tspan fill="#8b93f8">&gt;</tspan> event-driven · distributed systems · observability<tspan class="cursor" fill="#5eead4"> ▍</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#1f2940"/>
</svg>
